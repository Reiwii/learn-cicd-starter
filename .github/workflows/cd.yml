name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
  
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
         credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'
        with:
          version: '>= 363.0.0'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'


      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: build app
        run: (scripts/buildprod.sh)

      - name: bum bum
        run: (gcloud builds submit --tag europe-north1-docker.pkg.dev/notely-509516/notely-ar-repo/notely:latest .)

      - name: download goose 
        run:  (go install github.com/pressly/goose/v3/cmd/goose@latest)

      - name: Migrate 
        run:  (./scripts/migrateup.sh)

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image europe-north1-docker.pkg.dev/notely-509516/notely-ar-repo/notely:latest --region europe-north1 --allow-unauthenticated --project notely-509516 --max-instances=4

